name: Vercel API Call

on:
  workflow_dispatch:
    inputs:
      method:
        description: "HTTP method"
        required: true
        default: "GET"
        type: choice
        options: [GET, POST, PATCH, DELETE]
      path:
        description: "Path after https://api.vercel.com/ (e.g. v9/projects or v10/projects/01-glasscards-spread)"
        required: true
      body:
        description: "JSON request body (optional, for POST/PATCH)"
        required: false
        default: ""

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel API
        run: |
          set -e
          args=(-sS -o response.json -w "%{http_code}" -X "${{ inputs.method }}" \
            "https://api.vercel.com/${{ inputs.path }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json")
          if [ -n "${{ inputs.body }}" ]; then
            args+=(-d "${{ inputs.body }}")
          fi
          http_code=$(curl "${args[@]}")
          echo "HTTP $http_code"
          cat response.json
          echo "### ${{ inputs.method }} ${{ inputs.path }}: HTTP $http_code" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat response.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
